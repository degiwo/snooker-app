[project]
name = "snooker-backend"
version = "0.1.0"
description = "snooker-app backend"
readme = "README.md"
authors = [
    { name = "degiwo", email = "d.wong93@hotmail.de" }
]
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.162.0",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
snooker-backend = "snooker_backend:main"

[build-system]
requires = ["uv_build>=0.11.16,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ruff>=0.17.3",
]
