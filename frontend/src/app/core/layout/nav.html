<nav aria-label="Navigation">
  <ul>
    @for (item of items(); track item.path) {
      <li>
        <a
          [routerLink]="item.path"
          routerLinkActive="active"
          ariaCurrentWhenActive="page"
          [routerLinkActiveOptions]="{ exact: item.path === '/' }"
        >
          <span class="label">{{ item.label }}</span>
        </a>
      </li>
    }
  </ul>
</nav>
