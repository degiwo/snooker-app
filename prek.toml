# Configuration file for `prek`, a git hook framework written in Rust.
# See https://prek.j178.dev for more information.
#:schema https://www.schemastore.org/prek.json

[[repos]]
repo = "builtin"
hooks = [
    { id = "trailing-whitespace" },
    { id = "end-of-file-fixer" },
    { id = "check-added-large-files" },
    { id = "check-json", exclude = "^frontend/(tsconfig.*\\.json|\\.vscode/.*)$" },
    { id = "check-toml" },
    { id = "check-yaml" },
]

[[repos]]
repo = "https://github.com/astral-sh/ruff-pre-commit"
rev = "v0.17.3"
hooks = [
  { id = "ruff-check", args = ["--fix"] },
  { id = "ruff-format" },
]

[[repos]]
repo = "local"
hooks = [
    {
        id = "eslint",
        name = "eslint",
        entry = "frontend/node_modules/.bin/eslint --fix",
        language = "system",
        files = "^frontend/",
        types_or = ["javascript", "ts", "html"],
    },
    {
        id = "prettier",
        name = "prettier",
        entry = "frontend/node_modules/.bin/prettier --write --ignore-unknown",
        language = "system",
        types_or = ["javascript", "jsx", "ts", "tsx", "json", "css", "scss", "html", "markdown", "yaml"],
    },
]
