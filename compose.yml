# App on the platform

services:
  frontend:
    image: ghcr.io/degiwo/snooker-app-frontend:latest
    restart: unless-stopped
    env_file: .env
    # volumes:
    #   - ./data:/data
    labels:
      caddy: snooker.${APPS_DOMAIN:?}
      caddy.import: authelia
      caddy.reverse_proxy: "{{upstreams 80}}"
    networks:
      - default
      - platform

  backend:
    image: ghcr.io/degiwo/snooker-app-backend:latest
    restart: unless-stopped
    networks:
      - default  # unreachable for other apps on the server

networks:
  platform:
    external: true
