# App on the platform

services:
  app:
    image: ghcr.io/degiwo/snooker-app:latest
    restart: unless-stopped
    env_file: .env
    # volumes:
    #   - ./data:/data
    labels:
      caddy: snooker.${APPS_DOMAIN:?}
      caddy.import: authelia
      caddy.reverse_proxy: "{{upstreams 80}}"
    networks:
      - platform

networks:
  platform:
    external: true
