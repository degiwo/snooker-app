<div>
  <form [formGroup]="form" (ngSubmit)="submit()">
    <label for="opponent">Opponent:</label>
    <input type="text" formControlName="opponent" />
    <br />
    <label for="player_score">Player Score:</label>
    <input type="number" formControlName="player_score" />
    <br />
    <label for="opponent_score">Opponent Score:</label>
    <input type="number" formControlName="opponent_score" />
    <br />
    <button type="submit">Save</button>
  </form>
</div>

<router-outlet />
