name: CI
on: push
jobs:
  backend:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Sync dependencies
        working-directory: apps/backend
        run: uv sync --all-extras --dev

      - name: Backend checks
        run: make backend-check
